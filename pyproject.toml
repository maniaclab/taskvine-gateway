[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "taskvine-gateway"
version = "0.1.0"
description = "Self-service TaskVine worker pools on Kubernetes, authenticated via JupyterHub."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "kubernetes>=30.1",
    "jupyterhub>=5.2",
    "pydantic-settings>=2.4",
]

[project.scripts]
taskvine-gateway = "taskvine_gateway.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/taskvine_gateway"]
